name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" build
      - run: python -m pytest -q
      - name: wheel smoke test
        run: |
          python -m build && python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/stratum demo >/dev/null && /tmp/v/bin/stratum gatekeeper | grep -q ConstraintTemplate
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: build + smoke test locally
        run: |
          docker build -t stratum:rc .
          docker run --rm stratum:rc stratum gatekeeper | grep -q ConstraintTemplate
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: cosign sign (keyless) + verify
        run: |
          REF=ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          cosign sign --yes "$REF"
          cosign verify "$REF" \
            --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
  release:
    runs-on: ubuntu-24.04
    needs: image
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0,h)==1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $ver"; exit 1; }
          echo "" >> notes.md
          echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${ver}\` (cosign keyless-signed by release.yml)" >> notes.md
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "STRATUM $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
