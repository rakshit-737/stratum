name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" build
      - run: python -m pytest -q
      - name: wheel smoke test
        run: |
          python -m build && python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/stratum demo >/dev/null && /tmp/v/bin/stratum gatekeeper | grep -q ConstraintTemplate
          /tmp/v/bin/stratum --version | grep -qx "stratum ${GITHUB_REF_NAME#v}"
      # the release publishes exactly the files smoke-tested here (no rebuild)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: dist, path: dist/, if-no-files-found: error}
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: build + smoke test locally
        run: |
          docker build -t stratum:rc .
          docker run --rm stratum:rc stratum gatekeeper | grep -q ConstraintTemplate
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: cosign sign (keyless) + verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          REF="ghcr.io/$GITHUB_REPOSITORY@$DIGEST"
          cosign sign --yes "$REF"
          cosign verify "$REF" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
  release:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: dist, path: dist}
      - name: checksums
        run: cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS && cat SHA256SUMS
      # SLSA build provenance for the wheel and sdist (verify: gh attestation verify <file> -R <repo>)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0,h)==1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG section for $ver"; exit 1; }
          echo "" >> notes.md
          echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${ver}\` (cosign keyless-signed by release.yml)" >> notes.md
          echo "" >> notes.md
          echo "Python wheel and sdist: SHA-256 in \`SHA256SUMS\`; SLSA build provenance: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`." >> notes.md
          cat notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "STRATUM $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
