name: syscalls
# Container syscall dataset recorded on the runner (LID-DS / CB-DS are not downloadable non-interactively).
# One job per seed records ~160 strace traces of a workload container on an internal Docker network
# (scripts/record_syscalls.sh: routine operations vs BENIGN attack-shaped actions); the evaluate job runs
# the leave-one-run-out benchmark and uploads results/container_syscalls.{json,md} (commit those by hand);
# the JSON records this run's URL and commit (GITHUB_RUN_ID / GITHUB_SHA) and the seeds (= run numbers).
on:
  workflow_dispatch:
    inputs:
      runs: {description: "number of independent recording runs", default: "5"}
permissions: {contents: read}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs: {matrix: "${{ steps.m.outputs.matrix }}"}
    steps:
      - id: m
        env:
          RUNS: ${{ github.event.inputs.runs || '5' }}
        run: |
          [[ "$RUNS" =~ ^([1-9]|1[0-9]|20)$ ]] || { echo "runs must be 1-20, got '$RUNS'"; exit 1; }
          echo "matrix=$(python3 -c 'import json, sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' "$RUNS")" >> "$GITHUB_OUTPUT"
  record:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {run: "${{ fromJSON(needs.plan.outputs.matrix) }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - env:
          RUN: ${{ matrix.run }}
        run: bash scripts/record_syscalls.sh "traces/run-$RUN" "$RUN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "syscalls-run-${{ matrix.run }}", path: traces, retention-days: 90}
  evaluate:
    needs: record
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "syscalls-run-*", path: parts, merge-multiple: true}
      - run: python -m stratum.bench.container_syscalls parts results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: container-syscalls-results, path: "results/container_syscalls.*"}
