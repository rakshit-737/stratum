name: live
# Real Kubernetes (kind) + Cilium Tetragon + OPA Gatekeeper on the runner.
# Builds the demo image, pushes it to GHCR (public package), signs it keyless with cosign (GitHub OIDC),
# runs benign attack-shaped actions in the pods and asserts that STRATUM detects them and traces them to
# this commit. The image -> build -> commit edges are read from the verified cosign certificate, not from
# workflow variables; github.sha is only the expected value. An unsigned "drift" workload is the negative
# control. Policy-as-prevention is measured live: an egress NetworkPolicy generated by `stratum prevent`
# must block a connect to a sink outside the cluster CIDR that succeeded before it was applied.
# Only resources started by this job are contacted (plus package/image registries and Sigstore).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "repeat the scenario N times (separate jobs)"
        default: "1"
permissions: {}
concurrency: {group: "live-${{ github.ref }}", cancel-in-progress: false}
env:
  IMAGE: ghcr.io/rakshit-737/stratum-live-demo
  TETRAGON_CHART: 1.7.1
  GATEKEEPER_CHART: 3.20.0
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          n="${{ github.event.inputs.runs || '1' }}"
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(1, int('$n')+1))))")" >> "$GITHUB_OUTPUT"
  kind-tetragon:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -e .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}

      - name: build + push demo image
        id: img
        run: |
          docker build --build-arg REVISION=${{ github.sha }} -t $IMAGE:${{ github.sha }} deploy/live
          docker push $IMAGE:${{ github.sha }}
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }} | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: cosign sign (keyless) + verify
        id: cosign
        run: |
          mkdir -p live-out
          REF=$IMAGE@${{ steps.img.outputs.digest }}
          cosign sign --yes "$REF"
          if cosign verify "$REF" \
              --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              -o json > live-out/cosign-verify.json; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          # negative control: a wrong identity must not verify
          if cosign verify "$REF" --certificate-identity https://github.com/someone/else/.github/workflows/x.yml@refs/heads/main \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null 2>&1; then
            echo "wrong identity verified"; exit 1; fi

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with: {cluster_name: stratum}
      - name: install Tetragon + Gatekeeper
        run: |
          helm repo add cilium https://helm.cilium.io
          helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts
          helm install tetragon cilium/tetragon -n kube-system --version $TETRAGON_CHART --wait --timeout 8m
          helm install gatekeeper gatekeeper/gatekeeper -n gatekeeper-system --create-namespace \
            --version $GATEKEEPER_CHART --wait --timeout 8m
          kubectl -n kube-system rollout status ds/tetragon --timeout=5m
          kubectl apply -f deploy/live/tracingpolicy.yaml
      - name: apply exported Gatekeeper ConstraintTemplate (deny)
        run: |
          set -euo pipefail
          python -m stratum gatekeeper --level restricted --action deny \
            --exclude-namespace kube-system gatekeeper-system local-path-storage --out live-out/gatekeeper.yaml
          python - <<'EOF'
          import yaml
          docs = list(yaml.safe_load_all(open("live-out/gatekeeper.yaml")))
          yaml.safe_dump(docs[0], open("live-out/template.yaml", "w")); yaml.safe_dump(docs[1], open("live-out/constraint.yaml", "w"))
          EOF
          kubectl apply -f live-out/template.yaml
          for i in $(seq 60); do kubectl get crd stratumpodsecurity.constraints.gatekeeper.sh >/dev/null 2>&1 && break; sleep 2; done
          kubectl wait --for=condition=established crd/stratumpodsecurity.constraints.gatekeeper.sh --timeout=120s
          ok=0; for i in $(seq 30); do kubectl apply -f live-out/constraint.yaml && { ok=1; break; }; sleep 2; done
          [ $ok = 1 ] || { echo "constraint never applied"; exit 1; }
          kubectl create namespace stratum-live
          # wait until the constraint is enforced (server-side dry run of the privileged pod is rejected)
          ok=0; for i in $(seq 90); do
            kubectl apply --dry-run=server -f deploy/live/denied-pod.yaml 2>&1 | grep -q stratum && { ok=1; break; }; sleep 2; done
          [ $ok = 1 ] || { echo "Gatekeeper constraint never enforced"; kubectl get constrainttemplate stratumpodsecurity -o yaml; exit 1; }
      - name: deploy demo workloads
        run: |
          set -uo pipefail
          sed "s#IMAGE#$IMAGE@${{ steps.img.outputs.digest }}#g" deploy/live/workloads.yaml > live-out/workloads.yaml
          kubectl apply -f live-out/workloads.yaml
          admitted=true
          for d in web sink drift; do kubectl -n stratum-live rollout status deploy/$d --timeout=5m || admitted=false; done
          if kubectl apply -f deploy/live/denied-pod.yaml 2> live-out/denied.txt; then denied=false; else denied=true; fi
          cat live-out/denied.txt
          grep -q stratum live-out/denied.txt || denied=false
          echo "{\"privileged_denied\": $denied, \"demo_admitted\": $admitted}" > live-out/gatekeeper-result.json
          cat live-out/gatekeeper-result.json
      - name: wait for Tetragon to see the pods
        run: |
          set -uo pipefail
          for i in $(seq 60); do
            kubectl -n kube-system logs ds/tetragon -c export-stdout --tail=-1 2>/dev/null | grep -q '"namespace":"stratum-live"' && break; sleep 2; done
      - name: attack-shaped actions in the pods
        run: bash deploy/live/actions.sh
      - name: policy-as-prevention (live NetworkPolicy)
        run: |
          set -uo pipefail
          # sink outside 10.0.0.0/8, on the kind docker network of this runner
          docker run -d --rm --network kind --name stratum-extsink "busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662" httpd -f -p 8080
          EXT=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' stratum-extsink)
          POD=$(kubectl -n stratum-live get pod -l app=web -o jsonpath='{.items[0].metadata.name}')
          probe() { kubectl -n stratum-live exec "$POD" -- sh -c "printf 'GET / HTTP/1.0\r\n\r\n' | nc -w 3 $1 8080 >/dev/null" && echo true || echo false; }
          before=$(probe "$EXT")
          python -m stratum collect live-out/workloads.yaml --out live-out/pre.json
          python -m stratum prevent stratum-live --data live-out/pre.json > live-out/prevent.txt
          head -n -1 live-out/prevent.txt > live-out/egress-policy.yaml
          cat live-out/egress-policy.yaml
          kubectl apply -f live-out/egress-policy.yaml
          sleep 5
          after=$(probe "$EXT"); after2=$(probe "$EXT")
          [ "$after2" = true ] && after=true
          incluster=$(probe sink.stratum-live.svc.cluster.local)
          echo "{\"external_sink\": \"$EXT\", \"before\": $before, \"after\": $after, \"in_cluster_after\": $incluster}" | tee live-out/prevention.json
      - name: collect Tetragon events + cluster state
        run: |
          set -uo pipefail
          want=4  # R-SHELL, R-SA-TOKEN, R-NETTOOL on web + R-SHELL on drift
          for i in $(seq 45); do
            kubectl -n kube-system logs ds/tetragon -c export-stdout --tail=-1 > "$RUNNER_TEMP/tetragon-all.json"
            n=$(grep -c '"namespace":"stratum-live"' "$RUNNER_TEMP/tetragon-all.json" || true)
            grep -q '"pod":{"namespace":"stratum-live","name":"drift' "$RUNNER_TEMP/tetragon-all.json" && grep -q tcp_connect "$RUNNER_TEMP/tetragon-all.json" && [ "$n" -ge 10 ] && break
            sleep 2
          done
          # keep only the demo namespace for the artefact (the raw stream has every kube-system exec)
          grep '"namespace":"stratum-live"' "$RUNNER_TEMP/tetragon-all.json" > live-out/tetragon-events.json || true
          wc -l "$RUNNER_TEMP/tetragon-all.json" live-out/tetragon-events.json
          kubectl get pods -n stratum-live -o json > live-out/pods.json
          kubectl get constrainttemplate stratumpodsecurity -o yaml > live-out/template-status.yaml || true
          kubectl get stratumpodsecurity -o yaml > live-out/constraint-status.yaml || true
      - name: STRATUM detection + trace-to-commit (provenance from the cosign certificate)
        run: |
          set -o pipefail
          python -m stratum live-check --manifests live-out/workloads.yaml --pods live-out/pods.json \
            --events live-out/tetragon-events.json --cosign-json live-out/cosign-verify.json \
            --digest ${{ steps.img.outputs.digest }} --expect-commit ${{ github.sha }} --drift drift \
            --author "$(git log -1 --format=%an)" --gatekeeper live-out/gatekeeper-result.json \
            --prevention live-out/prevention.json \
            --cosign-ok ${{ steps.cosign.outputs.ok }} --out live-out/live-result.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-evidence-${{ matrix.run }}
          retention-days: 90
          path: |
            live-out/*.json
            live-out/*.yaml
            live-out/*.txt
          if-no-files-found: warn
