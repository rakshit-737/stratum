name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . "mkdocs-material>=9.5,<10" "mkdocs<2" "mkdocstrings[python]>=0.26" "mkdocs-redirects>=1.2,<2"
      - name: static consoles were rebuilt for this version
        run: |
          python - <<'EOF'
          import json, stratum
          for f in ("docs/demo/api/summary.json", "docs/demo-live/api/summary.json"):
              v = json.load(open(f))["version"]
              assert v == stratum.__version__, (f"{f} is from {v}, the package is {stratum.__version__}: run "
                                                "scripts/build_static_demo.py --source real|live --out docs/demo|docs/demo-live")
          print("consoles at", stratum.__version__)
          EOF
      - run: mkdocs build --strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22"}
      - name: every mermaid block in README and docs parses
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmd"
          python3 - "$RUNNER_TEMP/mmd" <<'EOF'
          import pathlib, re, sys
          out = pathlib.Path(sys.argv[1]); n = 0
          for f in [pathlib.Path("README.md"), *sorted(pathlib.Path("docs").rglob("*.md"))]:
              for i, b in enumerate(re.findall(r"```mermaid\n(.*?)```", f.read_text(encoding="utf-8"), re.S)):
                  (out / f"{f.as_posix().replace('/', '_')}-{i}.mmd").write_text(b, encoding="utf-8"); n += 1
          print(n, "mermaid blocks")
          EOF
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/pp.json"
          for f in "$RUNNER_TEMP"/mmd/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.17.0 -p "$RUNNER_TEMP/pp.json" -q -i "$f" -o "$f.svg" || { echo "mermaid parse error: $f"; exit 1; }
          done
      - name: the console must not be shadowed by a Markdown page
        run: grep -q '<title>STRATUM console</title>' site/demo/index.html && grep -q '<title>STRATUM console</title>' site/demo-live/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
