name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m stratum demo
  rego:
    # Rego/Python equivalence on the synthetic scenario and the committed real-manifest fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.0
      - run: pip install -e ".[dev]"
      - run: opa check stratum/policies/
      - run: python -m pytest -q tests/test_api_export.py -k rego
      - run: python -m pytest -q tests/test_gatekeeper.py
      - run: python -m stratum opa-check
  package:
    # build the wheel + sdist and smoke-test them outside the checkout (catches missing package data)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build && twine check dist/*
      - name: wheel smoke test in a clean venv
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/stratum --help && /tmp/v/bin/stratum demo > /dev/null
          /tmp/v/bin/stratum gatekeeper --out /tmp/g.yaml && grep -q ConstraintTemplate /tmp/g.yaml
      - name: dependency audit
        run: |
          /tmp/v/bin/pip install pip-audit "$(ls dist/*.whl)[api,bench]" >/dev/null
          /tmp/v/bin/pip-audit --progress-spinner off
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker build -t stratum:ci .
      - name: container smoke test
        run: |
          docker run --rm stratum:ci stratum gatekeeper | grep -q ConstraintTemplate
          docker run -d --name s -p 127.0.0.1:8000:8000 stratum:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/api/summary && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/summary | grep -q workloads
          docker rm -f s
