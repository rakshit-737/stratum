# Live-CI demo workloads. IMAGE is replaced by the workflow with ghcr.io/...@sha256:<digest>.
# Both deployments meet the PSS restricted checks so the exported Gatekeeper constraint admits them.
apiVersion: v1
kind: Namespace
metadata: {name: stratum-live}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: web-sa, namespace: stratum-live}

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: stratum-live}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      serviceAccountName: web-sa
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: IMAGE
          command: ["sleep", "infinity"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sink, namespace: stratum-live}
spec:
  replicas: 1
  selector: {matchLabels: {app: sink}}
  template:
    metadata: {labels: {app: sink}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sink
          image: IMAGE
          command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: sink, namespace: stratum-live}
spec:
  selector: {app: sink}
  ports: [{port: 8080, targetPort: 8080}]
---
# Negative control ("drift"): a digest-pinned upstream image that the pipeline did not build or sign.
# Its runtime alerts must NOT reach a commit, and STRATUM must name ZT-PROV-01.
apiVersion: apps/v1
kind: Deployment
metadata: {name: drift, namespace: stratum-live}
spec:
  replicas: 1
  selector: {matchLabels: {app: drift}}
  template:
    metadata: {labels: {app: drift}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: drift
          image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: ["sleep", "infinity"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
# Second negative control ("forged"): built in the same job from the same Dockerfile with the *right*
# org.opencontainers.image.revision label, pushed but never signed. Label provenance would attribute it
# to the commit; certificate provenance must not. UNSIGNEDREF is replaced by the workflow.
apiVersion: apps/v1
kind: Deployment
metadata: {name: forged, namespace: stratum-live}
spec:
  replicas: 1
  selector: {matchLabels: {app: forged}}
  template:
    metadata: {labels: {app: forged}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: forged
          image: UNSIGNEDREF
          command: ["sleep", "infinity"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
