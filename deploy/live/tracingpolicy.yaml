# File opens of projected SA tokens + TCP connects, exported as process_kprobe events.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata: {name: stratum-live}
spec:
  kprobes:
    - call: fd_install
      syscall: false
      args:
        - {index: 0, type: int}
        - {index: 1, type: file}
      selectors:
        - matchArgs:
            - {index: 1, operator: Postfix, values: ["/token"]}
    - call: tcp_connect
      syscall: false
      args:
        - {index: 0, type: sock}
