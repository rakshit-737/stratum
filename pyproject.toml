[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stratum"
version = "1.1.0"
description = "Open mini-CNAPP: code-to-runtime lifecycle graph, Zero-Trust policy (Python + Rego), trace-to-commit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["kubernetes", "cnapp", "supply-chain", "zero-trust", "runtime-security", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
bench = ["scikit-learn>=1.5", "matplotlib>=3.8"]
lstm = ["torch>=2.4,<3"]
neo4j = ["neo4j>=6.3.1"]
dev = ["pytest>=8", "ruff==0.8.4", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rakshit-737/stratum"

[project.scripts]
stratum = "stratum.cli:main"

[tool.setuptools]
packages.find = { include = ["stratum*"] }

[tool.setuptools.package-data]
stratum = ["web/*.html", "policies/*.rego", "policies/pss/*.rego", "data/live/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["realdata: needs the downloaded corpus in $STRATUM_DATA (skipped otherwise)"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "B905"]
