[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratum"
version = "0.2.0"
description = "Open mini-CNAPP: code-to-runtime lifecycle graph, Zero-Trust policy (Python + Rego), trace-to-commit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["kubernetes", "cnapp", "supply-chain", "zero-trust", "runtime-security", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
bench = ["scikit-learn>=1.4", "matplotlib>=3.8"]
neo4j = ["neo4j>=5"]
dev = ["pytest>=7", "ruff==0.8.4", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rakshit-737/stratum"

[project.scripts]
stratum = "stratum.cli:main"

[tool.setuptools]
packages = ["stratum", "stratum.bench"]

[tool.setuptools.package-data]
stratum = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["realdata: needs the downloaded corpus in $STRATUM_DATA (skipped otherwise)"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "B905"]
